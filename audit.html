<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMRP | Управление «А»</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #080a0c; --card: #0f1216; --border: #1e2329; --accent: #2ecc71; --text: #c9d1d9; --dim: #8b949e; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 40px 20px; }
.container { max-width: 1100px; margin: 0 auto; }
h1 { font-family: 'JetBrains Mono', monospace; color: #fff; margin-bottom: 20px; }
h1 span { color: var(--accent); }
.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab { padding: 10px 20px; background: var(--card); border: 1px solid var(--border); color: var(--dim); border-radius: 8px; cursor: pointer; font-weight: bold; }
.tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
.panel { display: none; }
.panel.active { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media(max-width: 768px) { .panel.active { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
h3 { font-family: 'JetBrains Mono', monospace; color: #fff; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

.task { padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; user-select: none; }
.task.active { background: rgba(46, 204, 113, 0.1); border-color: var(--accent); }
.task-head { display: flex; justify-content: space-between; cursor: pointer; align-items: center; }
.task input[type="checkbox"] { margin-right: 10px; accent-color: var(--accent); }
.task input[type="number"] { width: 50px; background: #000; border: 1px solid var(--border); color: #fff; text-align: center; border-radius: 4px; padding: 4px; outline: none; }
.task-body { margin-top: 10px; display: none; padding-top: 10px; border-top: 1px dashed var(--border); }
.task.active .task-body { display: block; }
.task-link { width: 100%; padding: 8px; background: #000; border: 1px solid var(--border); color: #4aa8ff; border-radius: 4px; font-size: 12px; outline: none; box-sizing: border-box; }
.task-link:focus { border-color: #4aa8ff; }

.total-box { display: flex; justify-content: space-between; background: rgba(46, 204, 113, 0.1); border: 1px solid var(--accent); padding: 15px; border-radius: 8px; margin-top: 20px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
.btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-family: 'Inter', sans-serif; transition: 0.2s; }
.btn:hover { opacity: 0.8; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.output { background: #000; border: 1px solid var(--border); padding: 15px; border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; white-space: pre-wrap; margin-top: 20px; max-height: 400px; overflow-y: auto; }
</style>
</head>
<body>

<div class="container">
  <h1>🛡️ Управление <span>«А»</span></h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('calc')">🧮 Калькулятор</div>
    <div class="tab" onclick="switchTab('report')">📝 Рапорт</div>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <div class="panel active" id="panel-calc">
    <div class="card">
      <h3>📋 Выберите задания</h3>
      <div id="tasksList"></div>
    </div>
    <div class="card">
      <h3>💰 Итог</h3>
      <div class="form-group">
        <label>Остаток с прошлого раза</label>
        <input type="number" id="prevPoints" value="0" oninput="calcTotal()">
      </div>
      <div class="total-box">
        <span>Всего:</span>
        <span id="totalDisplay" style="color:var(--accent)">0</span>
      </div>
    </div>
  </div>

  <!-- РАПОРТ -->
  <div class="panel" id="panel-report">
    <div class="card">
      <h3>✍️ Данные рапорта</h3>
      <button class="btn" style="background: #a855f7; margin-bottom: 20px;" onclick="autofill()">🪄 Заполнить из калькулятора</button>
      
      <div class="form-group">
        <label>Текущее звание</label>
        <select id="rpRank">
          <option value="Старший сержант">Старший сержант</option>
          <option value="Старшина">Старшина</option>
          <option value="Прапорщик">Прапорщик</option>
          <option value="Старший прапорщик">Старший прапорщик</option>
          <option value="Младший Лейтенант">Младший Лейтенант</option>
          <option value="Лейтенант">Лейтенант</option>
          <option value="Старший Лейтенант">Старший Лейтенант</option>
        </select>
      </div>

      <div class="form-group">
        <label>Желаемое звание (с ролью)</label>
        <select id="rpNext">
          <option value="Старшина <@&958783018573660190>">Старшина</option>
          <option value="Прапорщик <@&1279194354182783139>">Прапорщик</option>
          <option value="Старший прапорщик <@&1279194726775652445>">Старший прапорщик</option>
          <option value="Младший Лейтенант <@&883437994537791518>">Младший Лейтенант</option>
          <option value="Лейтенант <@&883437825503133736>">Лейтенант</option>
          <option value="Старший Лейтенант <@&883437620842070026>">Старший Лейтенант</option>
          <option value="Капитан <@&883437514419998721>">Капитан</option>
        </select>
      </div>

      <div class="form-group"><label>Ваше ФИО</label><input type="text" id="rpName" placeholder="Кирилл Макалистер"></div>
      <div class="form-group"><label>Static ID</label><input type="text" id="rpStatic" placeholder="104-844"></div>
      
      <button class="btn" onclick="generateReport()">Сгенерировать</button>
    </div>
    <div class="card">
      <h3>📄 Результат</h3>
      <div class="output" id="rpOutput">Здесь будет рапорт...</div>
      <button class="btn" style="background: #4aa8ff; color: #fff; margin-top: 10px;" onclick="copyReport()">📋 Скопировать</button>
    </div>
  </div>
</div>

<script>
  const TASKS = [
    { id:'arest', label:'Арест', pts:30, rep:'Аресты' },
    { id:'shtraf', label:'Выписать штраф', pts:10, rep:'Штрафы' },
    { id:'pohishenie', label:'Реагирование на похищение', pts:35, rep:'Реагирование на похищения' },
    { id:'kraz_win', label:'Победа в ВзК (КрАЗ)', pts:60, rep:'Победы в ВзК' },
    { id:'kraz_part', label:'Участие в отбитии КРАЗ', pts:30, rep:'Участие в отбитии КРАЗ' },
    { id:'post_win', label:'Поставка (успешная)', pts:60, rep:'Поставки' },
    { id:'post_part', label:'Участие в поставке', pts:30, rep:'Поставки' },
    { id:'terror', label:'Предотвращение теракта', pts:35, rep:'Предотвращение терактов' },
    { id:'raid', label:'Участие в рейде', pts:45, rep:'Рейды' },
    { id:'nalet_win', label:'Успешное отбитие налета', pts:60, rep:'Ограбления' },
    { id:'tyrma', label:'Отбитие Федеральной Тюрьмы', pts:45, rep:'Отбитие тюрьмы' },
    { id:'nalet_part', label:'Участие в отбитии налета', pts:30, rep:'Ограбления' }
  ];

  let selected = {};

  function render() {
    document.getElementById('tasksList').innerHTML = TASKS.map(t => {
      let isChecked = selected[t.id] ? selected[t.id].checked : false;
      let qty = selected[t.id] ? selected[t.id].qty : 1;
      let link = selected[t.id] ? selected[t.id].link : '';
      
      return `
        <div class="task ${isChecked ? 'active' : ''}">
          <div class="task-head" onclick="toggle('${t.id}')">
            <div style="display:flex; align-items:center;">
              <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggle('${t.id}')">
              <span>${t.label} <span style="color:#586069">(${t.pts} б.)</span></span>
            </div>
            ${isChecked ? `<input type="number" value="${qty}" min="1" onclick="event.stopPropagation()" onchange="setQty('${t.id}', this.value)">` : ''}
          </div>
          <div class="task-body">
             <input type="text" class="task-link" placeholder="🔗 Вставьте ссылку из Discord..." value="${link}" oninput="setLink('${t.id}', this.value)">
          </div>
        </div>
      `;
    }).join('');
    calcTotal();
  }

  function toggle(id) {
    if (!selected[id]) selected[id] = { checked: false, qty: 1, link: '' };
    selected[id].checked = !selected[id].checked;
    render();
  }

  function setQty(id, val) {
    if (selected[id]) selected[id].qty = parseInt(val) || 1;
    calcTotal();
  }

  function setLink(id, val) {
    if (selected[id]) selected[id].link = val.trim();
  }

  function getSum() {
    let total = 0;
    let details = [];
    for (let id in selected) {
      if (selected[id].checked) {
        let task = TASKS.find(t => t.id === id);
        let pts = task.pts * selected[id].qty;
        total += pts;
        details.push({ rep: task.rep, pts: pts, link: selected[id].link });
      }
    }
    return { total, details };
  }

  function calcTotal() {
    let res = getSum();
    let prev = parseInt(document.getElementById('prevPoints').value) || 0;
    document.getElementById('totalDisplay').textContent = prev + res.total;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if (tab === 'calc') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('panel-calc').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('panel-report').classList.add('active');
    }
  }

  function autofill() {
    let res = getSum();
    let grouped = {};
    
    res.details.forEach(d => {
      if (!grouped[d.rep]) grouped[d.rep] = { pts: 0, links: [] };
      grouped[d.rep].pts += d.pts;
      if (d.link) grouped[d.rep].links.push(d.link);
    });
    
    let workLines = [];
    for (let key in grouped) {
      workLines.push(`• ${key} - ${grouped[key].pts} баллов`);
      grouped[key].links.forEach(link => {
        workLines.push(link);
      });
      workLines.push(''); 
    }
    
    let text = workLines.length ? workLines.join('\n').trim() : 'Нет выполненных заданий';
    generateReport(text);
  }

  function generateReport(customWork) {
    let rank = document.getElementById('rpRank').value;
    let nextRole = document.getElementById('rpNext').value;
    let name = document.getElementById('rpName').value || 'Кирилл Макалистер';
    let sId = document.getElementById('rpStatic').value || '104-844';
    
    let res = getSum();
    let prev = parseInt(document.getElementById('prevPoints').value) || 0;
    
    let work = customWork || document.getElementById('rpOutput').textContent;
    
    let lines = [
      'Рапорт на повышение',
      `От: ${name} | ${sId}`,
      'Кому: @Ком. ЦСН «В» | Вениамин Монте @Нач. Упр. "А" | Монтеки А. @Зам. Нач. Упр. "А" | Аверин Е. @Зам. Нач. Упр. "А" | Акуленко А.',
      `Я, ${rank} ${name}, прошу рассмотреть мой рапорт и присвоить мне специальное звание ${nextRole}.`,
      'В связи с проделанной работой:',
      work,
      '',
      `Сумма: ${res.total} баллов`,
      `Остаток: ${prev} баллов`
    ];
    
    document.getElementById('rpOutput').textContent = lines.join('\n');
  }

  function copyReport() {
    navigator.clipboard.writeText(document.getElementById('rpOutput').textContent);
    alert('Рапорт с упоминаниями ролей скопирован!');
  }

  render();
</script>
</body>
</html>
