<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0b0f">
<title>RMRP | Управление «А»</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --fsb-bg: #080a0c; --fsb-card: #0f1216; --fsb-border: #1e2329; --fsb-accent: #2ecc71;
  --fsb-accent-glow: rgba(46, 204, 113, 0.3); --fsb-red: #e74c3c; --fsb-blue: #3498db;
  --fsb-text: #c9d1d9; --fsb-text-dim: #8b949e; --fsb-mono: 'JetBrains Mono', monospace;
}
body {
  background-color: var(--fsb-bg);
  background-image: radial-gradient(circle at 10% 20%, rgba(46, 204, 113, 0.05), transparent 40%), radial-gradient(circle at 90% 80%, rgba(52, 152, 219, 0.05), transparent 40%), linear-gradient(rgba(18, 22, 28, 0.95), rgba(8, 10, 12, 0.98));
  background-attachment: fixed; color: var(--fsb-text); font-family: 'Inter', sans-serif;
}
.container { max-width: 1240px; margin: 0 auto; padding: 0 22px; }
.header { background: rgba(8, 10, 12, 0.9); border-bottom: 1px solid var(--fsb-border); backdrop-filter: blur(12px); padding: 15px 0; }
.logo-text { font-size: 20px; font-weight: 900; font-family: var(--fsb-mono); color: #fff; display: flex; align-items: center; gap: 8px; }
.logo-text .accent { color: var(--fsb-accent); }

.audit-hero { padding: 60px 0 40px; border-bottom: 1px solid var(--fsb-border); background: linear-gradient(135deg, rgba(46, 204, 113, 0.05), rgba(52, 152, 219, 0.03)); }
.audit-hero h1 { font-size: clamp(28px, 5vw, 48px); font-weight: 900; color: #fff; font-family: var(--fsb-mono); margin: 0; }
.audit-hero h1 .accent { color: var(--fsb-accent); }

.section { padding: 40px 0; }
.vk-tabs { display: flex; gap: 6px; margin-bottom: 22px; padding: 6px; background: var(--fsb-card); border: 1px solid var(--fsb-border); border-radius: 10px; width: fit-content; }
.vk-tab { padding: 10px 24px; border-radius: 8px; background: transparent; color: var(--fsb-text-dim); font-size: 13px; font-weight: 700; cursor: pointer; border: 0; font-family: var(--fsb-mono); text-transform: uppercase; transition: 0.2s; }
.vk-tab:hover { background: #1a1e24; color: var(--fsb-text); }
.vk-tab.active { background: linear-gradient(135deg, var(--fsb-accent), var(--fsb-blue)); color: #000; }

.vk-panel { display: none; }
.vk-panel.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.vk-calc-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start; }
@media(max-width: 1000px) { .vk-calc-grid { grid-template-columns: 1fr; } }
.vk-calc-card { background: var(--fsb-card); border: 1px solid var(--fsb-border); border-radius: 12px; padding: 24px; }
.vk-calc-card h3 { color: #fff; font-size: 16px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--fsb-border); display: flex; align-items: center; gap: 8px; font-family: var(--fsb-mono); text-transform: uppercase; }
.vk-calc-card h3::before { content: "▸"; color: var(--fsb-accent); }

.vk-task { background: #0a0c0f; border: 1px solid var(--fsb-border); border-radius: 8px; margin-bottom: 8px; transition: all 0.25s; overflow: hidden; }
.vk-task:hover { border-color: rgba(46, 204, 113, 0.3); }
.vk-task.active { border-color: var(--fsb-accent); background: rgba(46, 204, 113, 0.03); }
.vk-task-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; user-select: none; }
.vk-task-head input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--fsb-accent); cursor: pointer; flex-shrink: 0; }
.vk-task-icon { font-size: 18px; flex-shrink: 0; }
.vk-task-label { flex: 1; font-size: 13.5px; color: var(--fsb-text); font-weight: 500; }
.vk-task-points { font-size: 12px; color: var(--fsb-accent); font-weight: 700; white-space: nowrap; font-family: var(--fsb-mono); }
.vk-task-body { display: none; padding: 0 14px 14px; border-top: 1px dashed var(--fsb-border); }
.vk-task.active .vk-task-body { display: block; }
.vk-time-row { display: grid; grid-template-columns: 1fr 80px; gap: 8px; align-items: center; padding: 8px 0; }
.vk-time-row + .vk-time-row { border-top: 1px solid var(--fsb-border); }
.vk-time-label { font-size: 12px; color: var(--fsb-text-dim); }
.vk-time-row input[type="number"] { width: 100%; padding: 6px 8px; border-radius: 6px; background: #0a0c0f; border: 1px solid var(--fsb-border); color: #fff; font-size: 13px; text-align: center; outline: none; font-family: var(--fsb-mono); }
.vk-task-link { width: 100%; padding: 8px 11px; border-radius: 6px; background: #0a0c0f; border: 1px solid var(--fsb-border); color: #4aa8ff; font-size: 12px; outline: none; box-sizing: border-box; margin-top: 8px; }
.vk-task-link:focus { border-color: #4aa8ff; }

.vk-calc-total { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; background: linear-gradient(135deg, rgba(46, 204, 113, 0.1), rgba(52, 152, 219, 0.08)); border: 1px solid rgba(46, 204, 113, 0.3); border-radius: 10px; margin-top: 16px; }
.vk-calc-total-label { font-size: 14px; font-weight: 600; color: var(--fsb-text); font-family: var(--fsb-mono); }
.vk-calc-total-value { font-size: 26px; font-weight: 900; color: var(--fsb-accent); font-family: var(--fsb-mono); }

.vk-report-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media(max-width: 700px) { .vk-report-form { grid-template-columns: 1fr; } }
.vk-report-form .full { grid-column: 1/-1; }
.vk-report-form label { display: block; font-size: 12px; font-weight: 600; color: var(--fsb-text-dim); margin-bottom: 6px; text-transform: uppercase; }
.vk-report-form input, .vk-report-form select, .vk-report-form textarea { width: 100%; padding: 10px 13px; border-radius: 8px; background: #0a0c0f; border: 1px solid var(--fsb-border); color: #fff; font-size: 13.5px; outline: none; transition: all 0.25s; font-family: inherit; box-sizing: border-box; }
.vk-report-form input:focus, .vk-report-form select:focus, .vk-report-form textarea:focus { border-color: var(--fsb-accent); box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.15); }
.vk-report-output { margin-top: 18px; padding: 18px; background: #0a0c0f; border: 1px solid var(--fsb-border); border-radius: 10px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: var(--fsb-text); max-height: 400px; overflow-y: auto; font-family: var(--fsb-mono); }
.vk-report-copy { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }

.vk-copy-btn, .btn-primary { background: linear-gradient(135deg, var(--fsb-accent), #27ae60); color: #000; font-weight: 800; font-family: var(--fsb-mono); text-transform: uppercase; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.vk-copy-btn:hover, .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--fsb-accent-glow); }
.btn-ghost { background: #1a1e24; color: var(--fsb-text); border: 1px solid var(--fsb-border); font-family: var(--fsb-mono); text-transform: uppercase; font-size: 12px; padding: 10px 18px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
.btn-ghost:hover { background: #252a32; border-color: var(--fsb-accent); }
</style>
</head>
<body>

<header class="header">
  <div class="container">
    <a href="index.html" class="logo-text" style="text-decoration: none;">
      <span>🛡️</span> RMRP <span class="accent">FSB</span>
    </a>
  </div>
</header>

<section class="audit-hero">
  <div class="container">
    <h1>🛡️ Управление <span class="accent">«А»</span></h1>
  </div>
</section>

<section class="section">
  <div class="container">

    <div class="vk-tabs">
      <button class="vk-tab active" data-tab="calc" onclick="switchTab('calc')">🧮 Калькулятор</button>
      <button class="vk-tab" data-tab="report" onclick="switchTab('report')">📝 Рапорт</button>
    </div>

    <!-- КАЛЬКУЛЯТОР -->
    <div class="vk-panel active" id="panel-calc">
      <div class="vk-calc-grid">
        <div class="vk-calc-card">
          <h3>📋 Выберите выполненные задания</h3>
          <div id="tasksList"></div>
        </div>
        <div class="vk-calc-card">
          <h3>💰 Итоговый подсчёт</h3>
          <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0a0c0f;border:1px solid var(--fsb-border);border-radius:8px;margin-bottom:16px">
            <span style="font-size:18px">🎯</span>
            <label for="prevPoints" style="flex:1;font-size:13px;color:var(--fsb-text)">Остаток баллов (с прошлого)</label>
            <input type="number" id="prevPoints" value="0" min="0" style="width:90px;padding:6px 8px;border-radius:6px;background:#0a0c0f;border:1px solid var(--fsb-border);color:#fff;font-size:14px;text-align:center;outline:none;font-family:var(--fsb-mono)" oninput="calcTotal()">
          </div>
          <div class="vk-calc-total">
            <span class="vk-calc-total-label">Всего баллов:</span>
            <span class="vk-calc-total-value" id="totalPoints">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- РАПОРТ -->
    <div class="vk-panel" id="panel-report">
      <div class="vk-calc-card">
        <button class="btn-primary" onclick="autofill()" style="margin-bottom:16px;">🪄 Заполнить из калькулятора</button>
        <h3>✍️ Данные рапорта</h3>
        <div class="vk-report-form">
          
          <div>
            <label>Текущее звание</label>
            <select id="rpRank">
              <option value="Старший сержант">Старший сержант</option>
              <option value="Старшина">Старшина</option>
              <option value="Прапорщик">Прапорщик</option>
              <option value="Старший прапорщик">Старший прапорщик</option>
              <option value="Младший Лейтенант">Младший Лейтенант</option>
              <option value="Лейтенант">Лейтенант</option>
              <option value="Старший Лейтенант">Старший Лейтенант</option>
            </select>
          </div>

          <div>
            <label>Желаемое звание (с ролью)</label>
            <select id="rpNext">
              <option value="Старшина <@&958783018573660190>">Старшина</option>
              <option value="Прапорщик <@&1279194354182783139>">Прапорщик</option>
              <option value="Старший прапорщик <@&1279194726775652445>">Старший прапорщик</option>
              <option value="Младший Лейтенант <@&883437994537791518>">Младший Лейтенант</option>
              <option value="Лейтенант <@&883437825503133736>">Лейтенант</option>
              <option value="Старший Лейтенант <@&883437620842070026>">Старший Лейтенант</option>
              <option value="Капитан <@&883437514419998721>">Капитан</option>
            </select>
          </div>

          <div><label>Ваше ФИО</label><input type="text" id="rpName" placeholder="Кирилл Макалистер" oninput="generateReport()"></div>
          <div><label>Static ID</label><input type="text" id="rpStatic" placeholder="104-844" oninput="generateReport()"></div>
          
          <div class="full">
            <label>Проделанная работа (обновляется из калькулятора)</label>
            <textarea id="rpWork" style="min-height:150px" placeholder="Нажми «Заполнить из калькулятора» или напиши вручную..." oninput="generateReport()"></textarea>
          </div>
        </div>

        <div class="vk-report-output" id="rpOutput"></div>
        <div class="vk-report-copy">
          <button class="vk-copy-btn" onclick="copyReport()">📋 Скопировать рапорт</button>
          <button class="btn-ghost" onclick="clearForm()">🗑️ Очистить</button>
        </div>
      </div>
    </div>

  </div>
</section>

<script>
  const TASKS = [
    { id:'arest', label:'Арест', pts:30, rep:'Аресты', icon:'🚔' },
    { id:'shtraf', label:'Выписать штраф', pts:10, rep:'Штрафы', icon:'📝' },
    { id:'pohishenie', label:'Реагирование на похищение', pts:35, rep:'Реагирование на похищения', icon:'🚨' },
    { id:'kraz_win', label:'Победа в ВзК (КрАЗ)', pts:60, rep:'Победы в ВзК', icon:'🏆' },
    { id:'kraz_part', label:'Участие в отбитии КРАЗ', pts:30, rep:'Участие в отбитии КРАЗ', icon:'🪖' },
    { id:'post_win', label:'Поставка (успешная)', pts:60, rep:'Поставки', icon:'🚚' },
    { id:'post_part', label:'Участие в поставке', pts:30, rep:'Поставки', icon:'📦' },
    { id:'terror', label:'Предотвращение теракта', pts:35, rep:'Предотвращение терактов', icon:'💥' },
    { id:'raid', label:'Участие в рейде', pts:45, rep:'Рейды', icon:'🎯' },
    { id:'nalet_win', label:'Успешное отбитие налета', pts:60, rep:'Ограбления', icon:'🛡️' },
    { id:'tyrma', label:'Отбитие Федеральной Тюрьмы', pts:45, rep:'Отбитие тюрьмы', icon:'⛓️' },
    { id:'nalet_part', label:'Участие в отбитии налета', pts:30, rep:'Ограбления', icon:'⚔️' }
  ];

  let selected = {};

  function switchTab(tab) {
    document.querySelectorAll('.vk-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('.vk-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
  }

  function render() {
    document.getElementById('tasksList').innerHTML = TASKS.map(t => {
      let sel = selected[t.id] || { checked: false, qty: 1, link: '' };
      return `
        <div class="vk-task ${sel.checked ? 'active' : ''}">
          <div class="vk-task-head" onclick="toggle('${t.id}')">
            <input type="checkbox" ${sel.checked ? 'checked' : ''} onclick="event.stopPropagation(); toggle('${t.id}')">
            <span class="vk-task-icon">${t.icon}</span>
            <span class="vk-task-label">${t.label}</span>
            <span class="vk-task-points">${t.pts} б.</span>
          </div>
          <div class="vk-task-body">
            <div class="vk-time-row">
              <label class="vk-time-label">Количество:</label>
              <input type="number" min="1" value="${sel.qty}" onclick="event.stopPropagation()" onchange="setQty('${t.id}', this.value)">
            </div>
            <input type="text" class="vk-task-link" placeholder="🔗 Вставьте ссылку из Discord..." value="${sel.link}" oninput="setLink('${t.id}', this.value)">
          </div>
        </div>
      `;
    }).join('');
    calcTotal();
  }

  function toggle(id) {
    if (!selected[id]) selected[id] = { checked: false, qty: 1, link: '' };
    selected[id].checked = !selected[id].checked;
    render();
  }

  function setQty(id, val) {
    if (selected[id]) selected[id].qty = parseInt(val) || 1;
    calcTotal();
  }

  function setLink(id, val) {
    if (selected[id]) selected[id].link = val.trim();
  }

  function getSum() {
    let total = 0, details = [];
    for (let id in selected) {
      if (selected[id].checked) {
        let task = TASKS.find(t => t.id === id);
        let pts = task.pts * selected[id].qty;
        total += pts;
        details.push({ rep: task.rep, pts: pts, link: selected[id].link });
      }
    }
    return { total, details };
  }

  function calcTotal() {
    let res = getSum();
    let prev = parseInt(document.getElementById('prevPoints').value) || 0;
    document.getElementById('totalPoints').textContent = prev + res.total;
  }

  function autofill() {
    let res = getSum();
    let grouped = {};
    
    res.details.forEach(d => {
      if (!grouped[d.rep]) grouped[d.rep] = { pts: 0, links: [] };
      grouped[d.rep].pts += d.pts;
      if (d.link) grouped[d.rep].links.push(d.link);
    });
    
    let workLines = [];
    for (let key in grouped) {
      workLines.push(`• ${key} - ${grouped[key].pts} баллов`);
      grouped[key].links.forEach(link => workLines.push(link));
      workLines.push(''); 
    }
    
    let text = workLines.length ? workLines.join('\n').trim() : 'Нет выполненных заданий';
    document.getElementById('rpWork').value = text;
    generateReport();
    switchTab('report');
  }

  function generateReport() {
    let rank = document.getElementById('rpRank').value;
    let nextRole = document.getElementById('rpNext').value;
    let name = document.getElementById('rpName').value || 'Кирилл Макалистер';
    let sId = document.getElementById('rpStatic').value || '104-844';
    let work = document.getElementById('rpWork').value || 'Нажми «Заполнить из калькулятора»';
    
    let res = getSum();
    let prev = parseInt(document.getElementById('prevPoints').value) || 0;
    
    let lines = [
      'Рапорт на повышение',
      `От: ${name} | ${sId}`,
      'Кому: @Ком. ЦСН «В» | Вениамин Монте @Нач. Упр. "А" | Монтеки А. @Зам. Нач. Упр. "А" | Аверин Е. @Зам. Нач. Упр. "А" | Акуленко А.',
      `Я, ${rank} ${name}, прошу рассмотреть мой рапорт и присвоить мне специальное звание ${nextRole}.`,
      'В связи с проделанной работой:',
      work,
      '',
      `Сумма: ${res.total} баллов`,
      `Остаток: ${prev} баллов`
    ];
    
    document.getElementById('rpOutput').textContent = lines.join('\n');
  }

  function copyReport() {
    navigator.clipboard.writeText(document.getElementById('rpOutput').textContent);
    alert('Рапорт с упоминаниями ролей скопирован!');
  }

  function clearForm() {
    document.getElementById('rpName').value = '';
    document.getElementById('rpStatic').value = '';
    document.getElementById('rpWork').value = '';
    generateReport();
  }

  // Инициализация
  render();
  document.getElementById('rpRank').addEventListener('change', generateReport);
  document.getElementById('rpNext').addEventListener('change', generateReport);
</script>
</body>
</html>
