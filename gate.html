<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0e12">
<title>RMRP | Доступ закрыт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden}

/* ============================================================
   ПРЕЛОАДЕР
   ============================================================ */
.preloader{
  position:fixed;inset:0;z-index:9999;
  background:
    radial-gradient(900px 700px at 50% 50%, rgba(255,70,85,.15), transparent 70%),
    radial-gradient(700px 500px at 20% 80%, rgba(74,168,255,.1), transparent 70%),
    linear-gradient(135deg, #0a0b0f 0%, #13141a 50%, #0a0b0f 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s ease, visibility .8s ease;
}
.preloader.hidden{opacity:0;visibility:hidden}
.preloader-bg{
  position:absolute;inset:0;z-index:0;opacity:.4;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 70%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 70%);
}
.preloader-content{position:relative;z-index:1;text-align:center;padding:20px}
.preloader-logo{
  width:140px;height:140px;margin:0 auto 32px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.preloader-logo::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(255,70,85,.25);
  animation:pulseRing 2s ease-out infinite;
}
.preloader-logo::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(74,168,255,.2);
  animation:pulseRing 2s ease-out infinite .5s;
}
@keyframes pulseRing{
  0%{transform:scale(.7);opacity:1}
  100%{transform:scale(1.4);opacity:0}
}
.preloader-emoji{
  font-size:64px;position:relative;z-index:1;
  filter:drop-shadow(0 0 30px rgba(255,70,85,.6));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-10px) rotate(2deg)}
}
.preloader-title{
  font-size:34px;font-weight:900;color:#fff;
  letter-spacing:-1px;margin-bottom:10px;
  background:linear-gradient(135deg,#fff,#ff6b78);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleIn 1s ease;
}
@keyframes titleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.preloader-sub{
  font-size:13.5px;color:#6e7385;letter-spacing:3px;text-transform:uppercase;
  font-weight:600;margin-bottom:40px;
}
.preloader-bar{
  width:340px;max-width:90vw;height:4px;background:rgba(255,255,255,.08);
  border-radius:99px;overflow:hidden;margin:0 auto 16px;position:relative;
}
.preloader-bar-fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ff4655,#ff6b78,#a855f7,#4aa8ff);
  background-size:200% 100%;
  animation:barFill 4s cubic-bezier(.4,0,.2,1) forwards, barShine 1.5s linear infinite;
  box-shadow:0 0 12px rgba(255,70,85,.5);
}
@keyframes barFill{0%{width:0}30%{width:35%}60%{width:70%}100%{width:100%}}
@keyframes barShine{
  0%{background-position:0% 50%}
  100%{background-position:200% 50%}
}
.preloader-percent{
  font-size:13px;color:#ff6b78;font-weight:800;letter-spacing:1px;
  font-family:'JetBrains Mono',monospace;
}
.preloader-hint{
  margin-top:30px;font-size:12px;color:#4b5563;font-style:italic;
  animation:hintFade 3s ease-in-out infinite;
}
@keyframes hintFade{0%,100%{opacity:.5}50%{opacity:1}}

.preloader-skip{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  padding:8px 20px;background:rgba(255,255,255,.06);color:#6e7385;
  border:1px solid rgba(255,255,255,.1);border-radius:99px;
  font-size:12px;font-weight:600;cursor:pointer;transition:.3s;
  z-index:10;
}
.preloader-skip:hover{background:rgba(255,255,255,.12);color:#fff}

/* ============================================================
   ГЕЙТ (ввод кода)
   ============================================================ */
.gate-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;visibility:hidden;
  background:radial-gradient(900px 600px at 50% 0%,rgba(255,70,85,.12),transparent 70%),#0d0e12;
  transition:opacity .6s ease, visibility .6s ease;
}
.gate-screen.show{opacity:1;visibility:visible}

.gate-wrap{
  width:100%;max-width:440px;background:#13141a;
  border:1px solid #2a2d38;border-radius:22px;padding:44px 36px;
  box-shadow:0 30px 90px rgba(0,0,0,.7);
  animation:gateIn .45s ease;
}
@keyframes gateIn{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
.gate-icon{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#ff4655,#ff6b78);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 26px;box-shadow:0 12px 36px rgba(255,70,85,.4);position:relative}
.gate-icon::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,70,85,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.08);opacity:.9}}
.gate-title{font-size:26px;font-weight:900;color:#fff;text-align:center;letter-spacing:-.6px;margin-bottom:10px}
.gate-sub{font-size:14px;color:#a8adbd;text-align:center;margin-bottom:32px;line-height:1.65}
.gate-field{margin-bottom:18px}
.gate-field label{display:block;font-size:11.5px;font-weight:700;color:#6e7385;margin-bottom:8px;text-transform:uppercase;letter-spacing:1.4px}
.gate-input{width:100%;padding:15px 18px;border-radius:12px;background:#0a0b0f;border:1px solid #2a2d38;color:#fff;font-size:16px;font-weight:700;outline:none;transition:.25s;font-family:monospace;letter-spacing:3px;text-align:center}
.gate-input::placeholder{color:#4b5563;letter-spacing:2px;font-weight:500}
.gate-input:focus{border-color:#ff4655;box-shadow:0 0 0 4px rgba(255,70,85,.15)}
.gate-btn{width:100%;padding:15px;border-radius:12px;background:linear-gradient(135deg,#ff4655,#ff6b78);color:#fff;font-weight:800;font-size:15px;border:0;cursor:pointer;transition:.25s;margin-top:10px;letter-spacing:.4px;box-shadow:0 6px 20px rgba(255,70,85,.25)}
.gate-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,70,85,.4)}
.gate-error{padding:12px 16px;border-radius:10px;background:rgba(255,70,85,.1);border:1px solid rgba(255,70,85,.3);color:#ff6b78;font-size:13px;text-align:center;margin-bottom:16px;display:none}
.gate-error.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.gate-hint{margin-top:26px;padding:16px 18px;background:#0a0b0f;border:1px solid #2a2d38;border-radius:12px;font-size:12.5px;color:#6e7385;text-align:center;line-height:1.7}
.gate-hint .icon{font-size:16px;margin-right:4px}

/* ============================================================
   КНОПКА «КОМФОРТ-ЗОНА» (снизу)
   ============================================================ */
.comfort-btn{
  position:fixed;bottom:22px;right:22px;z-index:100;
  padding:14px 22px;border-radius:99px;
  background:linear-gradient(135deg,#0e7490,#0891b2,#0284c7);
  background-size:200% 200%;animation:gradientMove 6s ease infinite;
  color:#fff;font-weight:800;font-size:13.5px;letter-spacing:.4px;
  border:0;cursor:pointer;
  box-shadow:0 10px 30px rgba(8,145,178,.4), 0 0 60px rgba(8,145,178,.2);
  display:flex;align-items:center;gap:10px;
  transition:.3s;
}
.comfort-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 40px rgba(8,145,178,.6), 0 0 80px rgba(8,145,178,.3)}
.comfort-btn .btn-icon{font-size:18px}
@keyframes gradientMove{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
</style>
</head>
<body>

<!-- ============================================================
     ПРЕЛОАДЕР
     ============================================================ -->
<div class="preloader" id="preloader">
  <div class="preloader-bg"></div>
  <div class="preloader-content">
    <div class="preloader-logo">
      <div class="preloader-emoji">⚖️</div>
    </div>
    <div class="preloader-title">RMRP LAW</div>
    <div class="preloader-sub">Загрузка портала</div>
    <div class="preloader-bar">
      <div class="preloader-bar-fill"></div>
    </div>
    <div class="preloader-percent" id="preloaderPercent">0%</div>
    <div class="preloader-hint">🎖️ Подготовка к службе…</div>
  </div>
  <button class="preloader-skip" onclick="Preloader.skip()">Пропустить →</button>
</div>

<!-- ============================================================
     ГЕЙТ
     ============================================================ -->
<div class="gate-screen" id="gateScreen">
  <div class="gate-wrap">
    <div class="gate-icon">🔒</div>
    <div class="gate-title">Доступ закрыт</div>
    <div class="gate-sub">Введите код доступа, чтобы продолжить.<br>Код выдаётся администрацией проекта в Discord.</div>

    <div class="gate-error" id="gateError">Неверный код. Попробуйте снова.</div>

    <div class="gate-field">
      <label>Код доступа</label>
      <input type="password" class="gate-input" id="gateCode" placeholder="••••••••" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')Gate.submit()">
    </div>

    <button class="gate-btn" onclick="Gate.submit()">🔓 Открыть доступ</button>

    <div class="gate-hint">
      <span class="icon">💡</span> Если у вас нет кода — обратитесь к администрации в Discord-канале проекта
    </div>
  </div>
</div>

<!-- ============================================================
     КНОПКА «КОМФОРТ-ЗОНА»
     ============================================================ -->
<button class="comfort-btn" onclick="location.href='comfort.html'">
  <span class="btn-icon">🎧</span>
  <span>Комфорт-зона</span>
</button>

<script src="auth.js"></script>
<script>
/* ============================================================
   PRELOADER — загрузка с музыкой и звуками
   ============================================================ */
(function(){
  'use strict';

  /* Ссылка на фоновую музыку прелоадера (замени, если надо) */
  var PRELOADER_MUSIC = 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=ambient-piano-logo-114118.mp3';

  /* Ссылка на звук нажатия клавиш */
  var KEY_SOUND = 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_4c9c3e8d50.mp3?filename=keyboard-typing-56-130168.mp3';

  var audioCtx = null;

  /* Создание звука через Web Audio API (если mp3 не работает) */
  function playClickSound(){
    try {
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1200 + Math.random() * 400;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch(e){}
  }

  /* ============================================================
     ПРЕЛОАДЕР
     ============================================================ */
  var Preloader = {
    startTime: Date.now(),
    minDuration: 4200,
    audio: null,

    init: function(){
      var self = this;

      /* Запуск музыки */
      try {
        self.audio = new Audio(PRELOADER_MUSIC);
        self.audio.volume = 0.25;
        self.audio.loop = false;
        self.audio.play().catch(function(){
          console.log('[RMRP] Автозапуск музыки заблокирован браузером');
        });
      } catch(e){}

      /* Обновление процентов */
      var percentEl = document.getElementById('preloaderPercent');
      var start = Date.now();
      var dur = self.minDuration;
      var interval = setInterval(function(){
        var elapsed = Date.now() - start;
        var pct = Math.min(100, Math.round((elapsed / dur) * 100));
        if(percentEl) percentEl.textContent = pct + '%';
        if(pct >= 100){
          clearInterval(interval);
          self.finish();
        }
      }, 50);

      /* Автозапуск после первого клика где угодно (для обхода блокировки) */
      document.addEventListener('click', function unlock(){
        if(self.audio && self.audio.paused){
          self.audio.play().catch(function(){});
        }
        document.removeEventListener('click', unlock);
      }, { once:true });
    },

    finish: function(){
      var preloader = document.getElementById('preloader');
      var gate = document.getElementById('gateScreen');
      if(preloader) preloader.classList.add('hidden');
      setTimeout(function(){
        if(gate) gate.classList.add('show');
        var inp = document.getElementById('gateCode');
        if(inp) inp.focus();
      }, 400);
    },

    skip: function(){
      /* Останавливаем музыку */
      if(this.audio){
        this.audio.pause();
        this.audio.currentTime = 0;
      }
      this.finish();
    }
  };

  /* ============================================================
     GATE — ввод кода
     ============================================================ */
  function getNext(){
    var params = new URLSearchParams(location.search);
    var next = params.get('next');
    if(!next || next.indexOf('gate.html') !== -1) next = 'index.html';
    return next;
  }

  window.Gate = {
    submit: function(){
      var code = document.getElementById('gateCode').value;
      /* Стоп музыку */
      if(Preloader.audio){
        Preloader.audio.pause();
      }
      if(RMRPAuth.passGate(code)){
        location.replace(getNext());
      } else {
        var err = document.getElementById('gateError');
        err.classList.add('show');
        document.getElementById('gateCode').value = '';
        setTimeout(function(){ err.classList.remove('show'); }, 3000);
      }
    }
  };

  /* ============================================================
     ЗВУКИ ПРИ ВВОДЕ
     ============================================================ */
  document.addEventListener('DOMContentLoaded', function(){
    var codeInput = document.getElementById('gateCode');
    if(codeInput){
      codeInput.addEventListener('input', function(){
        playClickSound();
      });
      codeInput.addEventListener('keydown', function(e){
        if(e.key === 'Backspace') playClickSound();
      });
    }
  });

  /* ============================================================
     СТАРТ
     ============================================================ */
  if(RMRPAuth.checkGate()){
    location.replace(getNext());
  } else {
    Preloader.init();
  }

})();
</script>
</body>
</html>
