<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0e12">
<title>RMRP | Доступ закрыт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(900px 600px at 50% 0%,rgba(255,70,85,.12),transparent 70%),var(--bg-1)}
.gate-wrap{width:100%;max-width:440px;background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:44px 36px;box-shadow:0 30px 90px rgba(0,0,0,.7);animation:gateIn .45s ease}
@keyframes gateIn{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
.gate-icon{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#ff4655,#ff6b78);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 26px;box-shadow:0 12px 36px rgba(255,70,85,.4);position:relative}
.gate-icon::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,70,85,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.08);opacity:.9}}
.gate-title{font-size:26px;font-weight:900;color:var(--txt-0);text-align:center;letter-spacing:-.6px;margin-bottom:10px}
.gate-sub{font-size:14px;color:var(--txt-2);text-align:center;margin-bottom:32px;line-height:1.65}
.gate-field{margin-bottom:18px}
.gate-field label{display:block;font-size:11.5px;font-weight:700;color:var(--txt-3);margin-bottom:8px;text-transform:uppercase;letter-spacing:1.4px}
.gate-input{width:100%;padding:15px 18px;border-radius:12px;background:var(--bg-1);border:1px solid var(--line);color:var(--txt-0);font-size:16px;font-weight:700;outline:none;transition:.25s;font-family:monospace;letter-spacing:3px;text-align:center}
.gate-input::placeholder{color:var(--txt-3);letter-spacing:2px;font-weight:500}
.gate-input:focus{border-color:#ff4655;box-shadow:0 0 0 4px rgba(255,70,85,.15)}
.gate-btn{width:100%;padding:15px;border-radius:12px;background:linear-gradient(135deg,#ff4655,#ff6b78);color:#fff;font-weight:800;font-size:15px;border:0;cursor:pointer;transition:.25s;margin-top:10px;letter-spacing:.4px;box-shadow:0 6px 20px rgba(255,70,85,.25)}
.gate-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,70,85,.4)}
.gate-error{padding:12px 16px;border-radius:10px;background:rgba(255,70,85,.1);border:1px solid rgba(255,70,85,.3);color:#ff6b78;font-size:13px;text-align:center;margin-bottom:16px;display:none}
.gate-error.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.gate-hint{margin-top:26px;padding:16px 18px;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--txt-3);text-align:center;line-height:1.7}
.gate-hint .icon{font-size:16px;margin-right:4px}
</style>
</head>
<body>

<div class="gate-wrap">
  <div class="gate-icon">🔒</div>
  <div class="gate-title">Доступ закрыт</div>
  <div class="gate-sub">Введите код доступа, чтобы продолжить.<br>Код выдаётся администрацией проекта в Discord.</div>

  <div class="gate-error" id="gateError">Неверный код. Попробуйте снова.</div>

  <div class="gate-field">
    <label>Код доступа</label>
    <input type="password" class="gate-input" id="gateCode" placeholder="••••••••" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')Gate.submit()">
  </div>

  <button class="gate-btn" onclick="Gate.submit()">🔓 Открыть доступ</button>

  <div class="gate-hint">
    <span class="icon">💡</span> Если у вас нет кода — обратитесь к администрации в Discord-канале проекта
  </div>
</div>

<script src="auth.js"></script>
<script>
(function(){
  function getNext(){
    var params = new URLSearchParams(location.search);
    var next = params.get('next');
    if(!next || next.indexOf('gate.html') !== -1) next = 'index.html';
    return next;
  }

  window.Gate = {
    submit: function(){
      var code = document.getElementById('gateCode').value;
      if(RMRPAuth.passGate(code)){
        location.replace(getNext());
      } else {
        var err = document.getElementById('gateError');
        err.classList.add('show');
        document.getElementById('gateCode').value = '';
        setTimeout(function(){ err.classList.remove('show'); }, 3000);
      }
    }
  };

  if(RMRPAuth.checkGate()) location.replace(getNext());

  setTimeout(function(){
    var inp = document.getElementById('gateCode');
    if(inp) inp.focus();
  }, 100);
})();
</script>
</body>
</html>
